version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: '21:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: master
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      maven-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot*"
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: '21:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: master
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker images referenced in docker-compose.yml (MySQL)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: '21:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: master
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
